[tips-and-tricks-item-description]
storage-optimizer=Storage optimizer je budova 1×1, která přesouvá [font=default-bold]celé stacky[/font] z jedné bedny rovnou do druhé – až 20 stacků najednou, bez pásů.\n\nDřív: bedna → unloader → pás → loader → bedna\nTeď: bedna → Storage optimizer → bedna\n\nPracuje jen jednou za interval svého tieru a bez práce spí, takže šetří UPS i ve velkých továrnách.
storage-optimizer-direction=Stejně jako inserter bere ze [font=default-bold]zdroje[/font] za sebou (strana s převodovkou) a dává do [font=default-bold]cíle[/font] před sebou (kam míří šipky na horní desce). Klávesa [font=default-bold]R[/font] ho otočí a prohodí zdroj a cíl.\n\nZdroje a cíle: bedny a sklady (i logistické a nekonečné bedny a velké sklady z modů), nákladní vagóny, montážní stroje a pece. Pásy a jiné budovy ignoruje.
storage-optimizer-transfer=Přesun je [font=default-bold]velikost stacku × počet stacků[/font] – např. železné pláty 100 × 5 = 500 plátů najednou. Obojí nastavíš v okně budovy; velikost stacku může být libovolná, i nad 255.\n\nPřesun proběhne jen celý: ve zdroji musí být všechny kusy a v cíli na ně musí být místo. Se zapnutým [font=default-bold]Přesouvat i zbytky[/font] se přesune, kolik jde, a bedny i vagóny se vyprázdní úplně.\n\nPřesun stojí 50 kJ + 5 kJ za každý další stack, větší přesun je tedy na kus levnější. Nečinný optimizer nespotřebovává nic.
storage-optimizer-machines=[entity=cargo-wagon] Nákladní vagón se obsluhuje, když vlak stojí (ve stanici nebo zastavený ručně). Optimizer postav vedle koleje tak, aby jeho zdroj nebo cíl ležel na vagónu.\n\nMontážní stroj nebo pec jako [font=default-bold]cíl[/font] dostane do vstupu suroviny receptu, jako [font=default-bold]zdroj[/font] vydá hotové výrobky. Palivo dál řeší insertery.
storage-optimizer-tiers=Každý pás ve hře – vanilla, Space Age i z libovolného modu – přináší vlastní tier s odpovídající rychlostí, receptem a výzkumem. Žlutý tier udělá jeden přesun za sekundu, rychlejší pásy úměrně rychleji.\n\nTier se vyrábí z předchozího a upgrade planner ho nahradí dalším. Všechna nastavení se přenáší v blueprintech, při kopírování nastavení (Shift+klik) i při přestavění na jiný tier.
storage-optimizer-circuit=Okno budovy má [font=default-bold]5 filtrů[/font] s bílou nebo černou listinou, volitelně podle kvality.\n\nPřipojený drátem jde optimizer povolit nebo zakázat podmínkou obvodové sítě, převzít filtry ze signálů a číst velikost stacku a počet stacků z řídicích signálů (výchozí [virtual-signal=signal-S] a [virtual-signal=signal-N]).\n\nMalé světlo v rohu ukazuje stav: zelená = pracuje, žlutá = čeká na předměty nebo místo, červená = bez proudu, vypnuto nebo chybí zdroj/cíl.
