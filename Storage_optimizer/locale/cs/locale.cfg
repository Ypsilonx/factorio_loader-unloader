[mod-name]
Storage_optimizer=Storage Optimizer

[mod-description]
Storage_optimizer=Přesouvá celé stacky mezi bednami, vagóny, montážními stroji a pecemi bez pásů – až 20 stacků najednou. Jedna budova místo loaderu, pásu a unloaderu. Šetří UPS.

[mod-setting-name]
storage-optimizer-interval-multiplier=Násobič intervalu přesunu
storage-optimizer-power-multiplier=Násobič spotřeby energie
storage-optimizer-max-stacks=Maximální počet stacků za přesun

[mod-setting-description]
storage-optimizer-interval-multiplier=Násobí čas mezi dvěma přesuny u všech tierů (žlutý tier 1 s). 2 = poloviční rychlost, 0,5 = dvojnásobná.
storage-optimizer-power-multiplier=Násobí energii za přesun (výchozí 50 kJ + 5 kJ za každý další stack). 0 = bez spotřeby.
storage-optimizer-max-stacks=Horní mez nastavení „Počet stacků za přesun“. Zásobník energie pojme dva nejdražší přesuny, proto s limitem roste.

[entity-name]
storage-optimizer=Storage optimizer (__1__)

[entity-description]
storage-optimizer=Přesouvá celé stacky ze zdroje za sebou do cíle před sebou – bedny a sklady (i logistické a nekonečné), vagóny stojícího vlaku, montážní stroje a pece (stroj jako cíl plní vstup, jako zdroj vydává výrobky; palivo neřeší). Počet stacků za přesun (výchozí limit 20) a velikost stacku nastavíš v okně budovy. Přesun proběhne jen celý (zdroj musí mít všechny kusy a cíl na ně místo), se zapnutými zbytky se přesune, kolik jde. Přesun stojí 50 kJ + 5 kJ za každý další stack.

[technology-name]
storage-optimizer=Storage optimizer (__1__)

[technology-description]
storage-optimizer=Přesouvá celé stacky mezi bednami, sklady a stroji bez pásů. Každý rychlejší pás přináší rychlejší tier, který se staví z předchozího.

