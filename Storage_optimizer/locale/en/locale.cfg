[tips-and-tricks-item-description]
storage-optimizer=The Storage optimizer is a 1×1 building that moves [font=default-bold]whole stacks[/font] from one chest straight into another – up to 20 stacks at once, without belts.\n\nBefore: chest → unloader → belt → loader → chest\nNow: chest → Storage optimizer → chest\n\nIt works only once per interval of its tier and sleeps when it has nothing to do, so it is gentle on UPS even in large factories.
storage-optimizer-direction=Like an inserter, it takes from the [font=default-bold]source[/font] behind it (the side with the gearbox) and puts into the [font=default-bold]target[/font] in front of it (where the arrows on the top plate point). Press [font=default-bold]R[/font] to rotate it and swap source and target.\n\nSources and targets: chests and warehouses (also logistic and infinity chests and big warehouses from mods), cargo wagons, assembling machines and furnaces. Belts and other buildings are ignored.
storage-optimizer-transfer=A transfer is [font=default-bold]stack size × stacks per transfer[/font] – e.g. iron plates 100 × 5 = 500 plates at once. Set both in the building's window; the stack size can be any amount, also above 255.\n\nA transfer happens only in full: the source must hold all items and the target must have room for all of them. Turn on [font=default-bold]Move leftovers too[/font] to move as much as possible and empty chests and wagons completely.\n\nA transfer costs 50 kJ + 5 kJ for each additional stack, so bigger transfers are cheaper per item. An idle optimizer uses no power.
storage-optimizer-machines=[entity=cargo-wagon] A cargo wagon is served while the train stands (at a station or stopped by hand). Build the optimizer next to the track so that its source or target lies on the wagon.\n\nAn assembling machine or furnace as [font=default-bold]target[/font] gets its input filled with the recipe ingredients, as [font=default-bold]source[/font] it gives its finished products. Fuel is left to inserters.
storage-optimizer-tiers=Every belt in the game – vanilla, Space Age or any belt mod – brings its own tier with a matching speed, recipe and technology. The yellow tier makes one transfer per second, faster belts are proportionally faster.\n\nA tier is crafted from a previous one and the upgrade planner replaces it with the next one. All settings are kept in blueprints, copy-paste (Shift+click) and when you replace a building with another tier.
storage-optimizer-circuit=The building's window has [font=default-bold]5 filters[/font] with whitelist or blacklist, optionally by quality.\n\nConnected with a wire, the optimizer can be enabled or disabled by a circuit condition, take its filters from signals and read the stack size and stacks per transfer from control signals (default [virtual-signal=signal-S] and [virtual-signal=signal-N]).\n\nThe small light in the corner shows the state: green = working, yellow = waiting for items or room, red = no power, disabled or missing source/target.
