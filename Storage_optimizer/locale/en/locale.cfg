[mod-name]
Storage_optimizer=Storage Optimizer

[mod-description]
Storage_optimizer=Moves whole stacks between chests, cargo wagons, assembling machines and furnaces without belts – up to 20 stacks at once. One building instead of loader + belt + unloader. Built for UPS.

[mod-setting-name]
storage-optimizer-interval-multiplier=Transfer interval multiplier
storage-optimizer-power-multiplier=Power consumption multiplier
storage-optimizer-max-stacks=Maximum stacks per transfer

[mod-setting-description]
storage-optimizer-interval-multiplier=Multiplies the time between two transfers for every tier (yellow tier 1 s). 2 = half as fast, 0.5 = twice as fast.
storage-optimizer-power-multiplier=Multiplies the energy per transfer (default 20 kJ + 5 kJ for each additional stack). 0 = no consumption.
storage-optimizer-max-stacks=Upper limit for the "Stacks per transfer" setting. The energy buffer holds two of the most expensive transfers, so it grows with this limit.

[entity-name]
storage-optimizer=Storage optimizer (__1__)

[entity-description]
storage-optimizer=Moves whole stacks from the source behind it to the target in front of it – chests and warehouses (also logistic and infinity chests), cargo wagons of a standing train, assembling machines and furnaces (a machine as target gets its input filled, as source it gives its products; fuel is not handled). Stacks per transfer (1–20) and stack size are set in the panel next to the building's window. A transfer happens only in full: the source must hold all items and the target must have room for all of them. A transfer costs 20 kJ + 5 kJ for each additional stack.

[technology-name]
storage-optimizer=Storage optimizer (__1__)

[technology-description]
storage-optimizer=Moves whole stacks between chests, warehouses, wagons and machines without belts. Each faster belt brings a faster tier, built from the previous one.

